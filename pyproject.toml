[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tgsherlock"
dynamic = ["version"]
description = "Local web panel for Telegram OSINT: live monitoring, alerts, user tracking and keyword sweeps."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["telegram", "osint", "monitoring", "threat-intelligence", "telethon"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Web Environment",
    "Topic :: Security",
]
dependencies = [
    "telethon>=1.34,<2",
    "aiohttp>=3.9",
    "qrcode>=7.4",
]

[project.scripts]
tgsherlock = "tgsherlock.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tgsherlock.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tgsherlock = ["static/*", "static/fonts/*", "assets/*"]
